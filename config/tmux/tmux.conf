# ~/.config/tmux/tmux.conf
# Adapted from radleylewis/dotfiles for macOS + Ghostty.
# Differences from the reference: truecolor via terminal-features (not the
# Wayland clipboard hack), TPM kept at ~/.tmux/plugins (existing install).

# ---------------------------------------------------------------------------
# Colours / truecolor (Ghostty + nvim themes look right inside tmux)
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",ghostty:RGB"
set -as terminal-overrides ",xterm*:Tc:sitm=\\E[3m"

# ---------------------------------------------------------------------------
# Prefix: C-s (was C-b)
# ---------------------------------------------------------------------------
set -g prefix C-s
unbind C-b
# Disable XON/XOFF flow control so C-s is not swallowed by the terminal.
# (flow-control option removed in tmux 3.4; stty handles this in the shell profile)
bind-key C-s send-prefix

# ---------------------------------------------------------------------------
# Sane defaults
# ---------------------------------------------------------------------------
set -g base-index 1                 # windows start at 1
set -g pane-base-index 1            # panes start at 1
set -g renumber-windows on          # renumber when a window closes
set -g detach-on-destroy off        # jump to another session, don't detach
set -g set-clipboard on             # OSC52 clipboard (works with Ghostty)
set -g mouse on
set -g history-limit 50000
set -g display-time 2000
set -g status-interval 5
set-option -sg escape-time 10       # nvim: faster <Esc>
set-option -g focus-events on       # nvim: autoread / FocusGained

# ---------------------------------------------------------------------------
# Windows / panes
# ---------------------------------------------------------------------------
bind c new-window -c "#{pane_current_path}"
bind x kill-pane
bind Space last-window
bind b break-pane

# Splits that open in the current path
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "󰑓 Config reloaded"

# Resize panes (repeatable with -r), m = zoom toggle
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

# ---------------------------------------------------------------------------
# Copy mode (vi)
# ---------------------------------------------------------------------------
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# Status bar on top
set-option -g status-position top

# ---------------------------------------------------------------------------
# Plugins (TPM lives at ~/.tmux/plugins — existing install)
# ---------------------------------------------------------------------------
set -g @plugin 'christoomey/vim-tmux-navigator'   # C-hjkl across nvim + tmux
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'      # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'      # auto-save sessions
set -g @plugin 'tmux-plugins/tmux-yank'           # y in copy-mode -> pbcopy

# ---------------------------------------------------------------------------
# Theme (nightfox-inspired)
# ---------------------------------------------------------------------------
set -g status-style bg='#1b1e37',fg='#e1e1e2'
set -g message-style bg='#030b1e',fg='#e2c779'
set -g pane-border-style fg='#696969'
set -g pane-active-border-style fg='#e2c779'
set -g mode-style bg='#e2c779',fg='#1b1e37'

set -g status-left-length 60
set -g status-left "#[fg=#e2c779,bg=#1b1e37]#[fg=#1b1e37,bg=#e2c779,bold] #S  #[fg=#e2c779,bg=#1b1e37]"

set -g status-right-length 120
set -g status-right "#[fg=#1b1e37]#[fg=#e1e1e2,bg=#1b1e37] 󰥔 %H:%M #[fg=#e1e1e2] #[fg=#696969]󰃭 %Y-%m-%d #[fg=#1b1e37]#[fg=#ff6b8a,bg=#1b1e37] 󰅒 #(whoami)@#H "

set -g window-status-format "#[fg=#696969] 󰈚 #I:#W "
set -g window-status-current-format "#[fg=#e1e1e2,bg=#030b1e,bold] 󰈚 #I:#W #[default]"
set -g window-status-separator ""

# ---------------------------------------------------------------------------
# Session persistence
# ---------------------------------------------------------------------------
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

# ---------------------------------------------------------------------------
# Pop-ups
# ---------------------------------------------------------------------------
# Session switcher (fzf)
bind w display-popup -E -b rounded -T " Sessions" -w 30% -h 50% ~/.config/tmux/scripts/tmux-menu.sh

# Scratchpad
bind T display-popup -E -w 80% -h 80% ~/.config/tmux/scripts/tmux-scratch.sh
bind -T popup t send-keys t
bind -T popup q send-keys q
bind -T popup T detach
bind -T popup C-[ copy-mode

# LazyGit
bind g display-popup -d "#{pane_current_path}" -E -b none -w 81% -h 80% lazygit

# SSH menu (fzf over ~/.ssh/config)
bind S display-popup -E -b none -w 40% -h 50% ~/.config/tmux/scripts/tmux-ssh.sh

# ---------------------------------------------------------------------------
# TPM init — keep LAST
# ---------------------------------------------------------------------------
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
run '~/.tmux/plugins/tpm/tpm'
